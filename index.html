<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude OS</title>
<meta name="description" content="Learn Claude by building. 41 guides tracked, tasks, streaks, XP, and a 120-tool vault. By AI in Public.">
<meta property="og:title" content="Claude OS">
<meta property="og:description" content="Learn Claude by building. 41 guides tracked, tasks, streaks, XP, and a 120-tool vault. By AI in Public.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0B5FFF">
<link rel="manifest" href="/claude-os/manifest.webmanifest">
<link rel="apple-touch-icon" href="/claude-os/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claude OS">
<link rel="icon" href="/claude-os/icon-192.png">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap">
<style>
:root{
  --bg:#FAFAF8; --dot:#E6E6DF; --panel:#FFFFFF; --ink:#12161B; --muted:#5B6572; --line:#E4E4DE;
  --accent:#0B5FFF; --accent-soft:#EAF1FF; --accent-ink:#0B5FFF;
  --done:#188A52; --done-soft:#E3F3EA;
  --prac:#B36A00; --prac-soft:#FBF0DD;
  --read:#0B5FFF; --read-soft:#EAF1FF;
  --none:#8A93A0; --none-soft:#EFEFEA;
  --shadow:0 1px 2px rgba(18,22,27,.05),0 4px 16px rgba(18,22,27,.05);
  --gold:#B8860B;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116; --dot:#1B222C; --panel:#161B22; --ink:#E9ECF0; --muted:#98A2B0; --line:#262D37;
    --accent:#5B93FF; --accent-soft:#1B2A4A; --accent-ink:#8FB4FF;
    --done:#3FBF7F; --done-soft:#123526;
    --prac:#E0A245; --prac-soft:#33270F;
    --read:#5B93FF; --read-soft:#1B2A4A;
    --none:#7A8494; --none-soft:#1D232C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
    --gold:#D4A72C;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116; --dot:#1B222C; --panel:#161B22; --ink:#E9ECF0; --muted:#98A2B0; --line:#262D37;
  --accent:#5B93FF; --accent-soft:#1B2A4A; --accent-ink:#8FB4FF;
  --done:#3FBF7F; --done-soft:#123526;
  --prac:#E0A245; --prac-soft:#33270F;
  --read:#5B93FF; --read-soft:#1B2A4A;
  --none:#7A8494; --none-soft:#1D232C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  --gold:#D4A72C;
}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1.4px);background-size:22px 22px;color:var(--ink);font:14.5px/1.6 "JetBrains Mono",ui-monospace,monospace;-webkit-font-smoothing:antialiased}
.rail{background:var(--bg)}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
.app{display:flex;min-height:100vh}
.rail{width:220px;flex-shrink:0;border-right:1px solid var(--line);padding:28px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:19px;letter-spacing:-1px;margin:0 10px 4px}
.logo span{color:var(--accent)}
.tag{font:11px/1.4 "JetBrains Mono",monospace;color:var(--muted);margin:0 10px 24px;text-transform:uppercase;letter-spacing:.08em}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;border-radius:8px;padding:10px 12px;font:600 14px "JetBrains Mono",monospace;color:var(--muted);cursor:pointer}
.nav-btn:hover{background:var(--none-soft);color:var(--ink)}
.nav-btn.active{background:var(--accent-soft);color:var(--accent-ink)}
.nav-btn:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rail .foot{margin-top:auto;font:11px/1.6 "JetBrains Mono",monospace;color:var(--muted);padding:0 10px}
main{flex:1;min-width:0;padding:36px 40px 80px;max-width:1060px}
h1{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:27px;letter-spacing:-1px;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 28px;max-width:62ch}
h2{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:16.5px;letter-spacing:-.3px;margin:34px 0 14px}
.mono{font-family:"JetBrains Mono",monospace}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi .n{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:30px;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.kpi .l{font:11px "JetBrains Mono",monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.modbars{display:flex;flex-direction:column;gap:12px}
.modbar{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;cursor:pointer;box-shadow:var(--shadow)}
.modbar:hover{border-color:var(--accent)}
.modbar .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.modbar .name{font-weight:700;font-size:15px}
.modbar .pct{font:500 13px "JetBrains Mono",monospace;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--none-soft);border-radius:3px;margin-top:10px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:3px;transition:width .4s ease}
.fill.full{background:var(--done)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow)}
.guide{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.guide:first-child{border-top:none}
.g-main{flex:1;min-width:0}
.g-title{font-weight:600;font-size:15px}
.g-meta{font:12px "JetBrains Mono",monospace;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 14px}
.g-build{font-size:13px;color:var(--muted);margin-top:4px}
.status{flex-shrink:0;border:none;border-radius:999px;padding:7px 14px;font:600 12px "JetBrains Mono",monospace;cursor:pointer;min-width:104px}
.s0{background:var(--none-soft);color:var(--none)}
.s1{background:var(--read-soft);color:var(--read)}
.s2{background:var(--prac-soft);color:var(--prac)}
.s3{background:var(--done-soft);color:var(--done)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:7px 14px;font:600 13px "JetBrains Mono",monospace;cursor:pointer}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prompt{margin-bottom:14px}
.p-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.p-name{font-weight:700;font-size:15px}
.p-cat{font:11px "JetBrains Mono",monospace;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.06em}
.p-for{font-size:13px;color:var(--muted);margin:2px 0 8px}
.p-body{font:13.5px/1.6 "JetBrains Mono",monospace;background:var(--none-soft);border-radius:8px;padding:12px 14px;white-space:pre-wrap;overflow-x:auto}
.copy{flex-shrink:0;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 14px;font:600 12px "JetBrains Mono",monospace;cursor:pointer}
:root[data-theme="dark"] .copy{color:#0E1116}
.copy.ok{background:var(--done)}
.wb .ex{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.wb .ex:first-of-type{border-top:none}
.wb input[type=checkbox]{width:17px;height:17px;margin-top:3px;accent-color:var(--accent);flex-shrink:0;cursor:pointer}
.wb label{cursor:pointer}
.wb .done-ex{color:var(--muted);text-decoration:line-through}
.milestone{margin-top:14px;background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-size:14px}
.milestone b{color:var(--accent-ink);font-family:"JetBrains Mono",monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:4px}
.win-form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end}
.win-form .f{display:flex;flex-direction:column;gap:5px}
.win-form label{font:11px "JetBrains Mono",monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.win-form input,.win-form select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:14px "JetBrains Mono",monospace;color:var(--ink)}
.add{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:11px 18px;font:700 14px "JetBrains Mono",monospace;cursor:pointer}
:root[data-theme="dark"] .add{color:#0E1116}
.win{display:flex;gap:14px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}
.win:first-child{border-top:none}
.win .d{font:12px "JetBrains Mono",monospace;color:var(--muted);flex-shrink:0;font-variant-numeric:tabular-nums}
.win .t{flex:1;font-weight:600}
.win .s{font:12px "JetBrains Mono",monospace;color:var(--done);flex-shrink:0}
.win .x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 6px}
.win .x:hover{color:var(--ink)}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.res{display:flex;gap:14px;padding:11px 0;border-top:1px solid var(--line);align-items:baseline}
.res:first-child{border-top:none}
.res .rn{font-weight:600;min-width:0;flex:1}
.res .rt{font:11px "JetBrains Mono",monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;flex-shrink:0}
.search{display:block;width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 14px;font:13.5px "JetBrains Mono",monospace;color:var(--ink);margin:0 0 14px}
.search:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hidden{display:none}
.bk-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bk-row input{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:12.5px "JetBrains Mono",monospace;color:var(--ink)}
.btn2{background:var(--none-soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px 16px;font:600 13px "JetBrains Mono",monospace;cursor:pointer}
.btn2:hover{border-color:var(--accent)}
.btn2.danger:hover{border-color:#C33;color:#C33}
.bk-note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.onboard{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:18px 20px;margin:0 0 24px}
.onboard b{font-size:15px}
.onboard ol{margin:10px 0 0;padding-left:22px}
.onboard li{margin:6px 0}
.locked{opacity:.62}
.notebtn{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);font:600 10.5px "JetBrains Mono",monospace;cursor:pointer;padding:2px 8px}
.notebtn:hover{border-color:var(--accent);color:var(--accent-ink)}
.notebtn.has{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.g-notes{display:block;width:100%;min-height:74px;margin-top:10px;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font:13px/1.6 "JetBrains Mono",monospace;color:var(--ink);resize:vertical;box-sizing:border-box}
.g-notes:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.locked .g-title,.locked .p-name{color:var(--muted)}
a.status{display:inline-block;text-align:center;text-decoration:none}
a.status:hover{text-decoration:none;color:var(--accent-ink)}
.lockbtn{text-decoration:none;display:inline-block}
.cta-band{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:14px 18px;margin:0 0 20px;font-size:13.5px;line-height:1.6}
.cta-band a{font-weight:700}
.miles{display:flex;flex-wrap:wrap;gap:8px}
.mile{border:1px dashed var(--line);border-radius:999px;padding:7px 14px;font:600 12px "JetBrains Mono",monospace;color:var(--muted)}
.mile.hit{border:1px solid var(--done);background:var(--done-soft);color:var(--done)}
.certlink{display:block;background:none;border:none;color:var(--accent-ink);font:600 12.5px "JetBrains Mono",monospace;cursor:pointer;padding:0;margin-top:10px;text-align:left}
.certlink:hover{text-decoration:underline}
.scard{background:var(--ink);color:var(--bg);border-radius:14px;padding:26px 28px;position:relative;overflow:hidden}
.scard::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:var(--accent);opacity:.25}
.sc-brand{font:700 12px "JetBrains Mono",monospace;letter-spacing:.1em}
.sc-brand span{opacity:.55;font-weight:500}
.sc-big{font:800 56px/1.1 "JetBrains Mono",monospace;letter-spacing:-3px;margin:8px 0 2px}
.sc-line{font:500 13px "JetBrains Mono",monospace;opacity:.85}
.sc-url{font:700 12px "JetBrains Mono",monospace;color:var(--accent);margin-top:14px;filter:brightness(1.4)}
.overlay{position:fixed;inset:0;background:rgba(10,12,16,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.cert{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:520px;width:100%;padding:34px 34px 28px;position:relative;overflow:hidden;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.cert .c-eyebrow{font:700 11px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink)}
.cert .c-title{font:800 26px/1.2 "JetBrains Mono",monospace;letter-spacing:-1px;margin:10px 0 4px}
.cert .c-sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.cert .c-name{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px 14px;font:700 16px "JetBrains Mono",monospace;color:var(--ink);text-align:center;width:80%;margin:0 auto 6px;display:block}
.cert .c-date{font:500 11.5px "JetBrains Mono",monospace;color:var(--muted);margin:8px 0 18px}
.cert .c-close{position:absolute;top:12px;right:14px;background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer}
.cert .bk-row{justify-content:center}
.tcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:20px}
.tcol{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.tcol h3{font:800 13px "JetBrains Mono",monospace;letter-spacing:.02em;margin:0 0 8px;text-transform:uppercase}
.tcount{color:var(--muted);font-weight:500}
.task{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:none}
.task input[type=checkbox]{width:16px;height:16px;margin-top:3px;accent-color:var(--done);flex-shrink:0;cursor:pointer}
.tk-text{flex:1;font-size:13px;line-height:1.5;min-width:0}
.tdone .tk-text{color:var(--muted);text-decoration:line-through}
.tk-pr{color:#C2410C;font-weight:800;margin-right:5px}
.tk-mod{font:600 10px "JetBrains Mono",monospace;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 8px;white-space:nowrap}
.tk-moves{display:flex;gap:2px;flex-shrink:0}
.tk-btn{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);font:600 11px "JetBrains Mono",monospace;cursor:pointer;padding:2px 7px}
.tk-btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.tk-del{border:none}
.wb-task{flex-shrink:0;margin-top:2px}
.hm{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;grid-auto-columns:11px;gap:3px}
.hc{width:11px;height:11px;border-radius:3px}
.h0{background:var(--none-soft)}
.h1{background:var(--accent);opacity:.32}
.h2{background:var(--accent);opacity:.62}
.h3{background:var(--accent)}
.hx{background:transparent}
.htoday{outline:1.5px solid var(--ink);outline-offset:1px}
.hm-stats{display:flex;flex-wrap:wrap;gap:6px 18px;font:500 12px "JetBrains Mono",monospace;color:var(--muted);margin:0 0 12px}
.hm-stats b{color:var(--ink);font-weight:800;font-size:14px}
.hm-wrap{display:flex;gap:8px;align-items:flex-end}
.hm-days{display:grid;grid-template-rows:repeat(7,11px);gap:3px;font:500 8.5px "JetBrains Mono",monospace;color:var(--muted)}
.hm-days span{line-height:11px}
.hm-scroll{overflow-x:auto;padding-bottom:2px}
.hm-months{display:grid;gap:3px;font:500 9px "JetBrains Mono",monospace;color:var(--muted);margin-bottom:4px}
.hm-months span{overflow:visible;white-space:nowrap}
.hm-legend{display:flex;align-items:center;gap:4px;font:500 10.5px "JetBrains Mono",monospace;color:var(--muted);margin-top:10px;justify-content:flex-end}
.disclaim{border:1px dashed var(--muted);border-radius:12px;padding:14px 18px;margin:0 0 18px;font-size:13px;color:var(--muted);line-height:1.6}
.disclaim b{color:var(--ink)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.tool{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:5px}
.tool:hover{border-color:var(--accent)}
.t-top{display:flex;align-items:flex-start;gap:10px}
.t-logo{width:30px;height:30px;border-radius:7px;flex-shrink:0;object-fit:contain;background:#fff;border:1px solid var(--line);padding:2px;box-sizing:border-box}
.t-letter{display:flex;align-items:center;justify-content:center;color:#fff;font:800 15px "JetBrains Mono",monospace;border:none;padding:0}
.t-name{font-weight:700;font-size:14px;flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.t-name a{color:var(--ink)}
.t-name a:hover{color:var(--accent-ink)}
.t-pick{color:var(--prac);font:700 10px "JetBrains Mono",monospace;letter-spacing:.05em}
.t-price{font:700 10px "JetBrains Mono",monospace;border-radius:999px;padding:4px 10px;white-space:nowrap;flex-shrink:0;text-transform:uppercase;letter-spacing:.04em}
.t-price.free{background:var(--done-soft);color:var(--done)}
.t-price.paid{background:var(--accent-soft);color:var(--accent-ink)}
.t-cat{font:600 9.5px "JetBrains Mono",monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.t-why{font-size:12.5px;color:var(--muted);line-height:1.55}
#dotfx{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{position:relative;z-index:1}
body.fx{background-image:none}
.kpi,.tool,.modbar,.card{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.kpi:hover,.tool:hover{transform:translateY(-3px);box-shadow:0 6px 22px rgba(18,22,27,.10)}
.modbar:hover{transform:translateY(-2px)}
.sc-name{font:700 34px/1 "Caveat",cursive;color:#fff;margin:6px 0 2px;transform:rotate(-2deg);transform-origin:left}
.c-handname{font:700 40px/1.15 "Caveat",cursive;color:var(--ink);min-height:46px;margin:2px 0 0}
.cert .c-name{background:transparent;border:none;border-bottom:2px dashed var(--line);border-radius:0;font:700 30px/1.2 "Caveat",cursive;padding:2px 10px;width:70%}
.cert .c-name::placeholder{font:600 22px "Caveat",cursive;color:var(--muted)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:13px 22px;border-radius:10px;font:600 13px "JetBrains Mono",monospace;z-index:70;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:min(90vw,520px);text-align:center}
.cert.grand{border:2px solid var(--ink);outline:1.5px solid var(--gold);outline-offset:-8px}
.g-seal{position:absolute;top:16px;left:16px;width:46px;height:46px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;border:2px solid var(--ink)}
.streak-alert{background:var(--prac-soft);border:1px solid var(--prac);border-radius:12px;padding:13px 18px;margin:0 0 18px;font-size:13.5px}
.habit-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.habit-row input[type=time]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:600 13px "JetBrains Mono",monospace;color:var(--ink)}
.habit-row .hl{font:500 11px "JetBrains Mono",monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

const TILE_COLORS=["#0B5FFF","#188A52","#B36A00","#7C3AED","#C2410C","#0E7490"];
function logoHTML(t){const h=thost(t[4]);const src=LOGOS[h];
  if(src)return `<img class="t-logo" src="${src}" alt="" loading="lazy">`;
  const c=TILE_COLORS[(t[0].charCodeAt(0)+t[0].length)%TILE_COLORS.length];
  return `<span class="t-logo t-letter" style="background:${c}">${esc(t[0][0])}</span>`}

function levelOf(xp){let li=0;for(let i=0;i<LEVELS.length;i++)if(xp>=LEVELS[i][0])li=i;
  const next=LEVELS[li+1];return{i:li,name:LEVELS[li][1],cur:LEVELS[li][0],next:next?next[0]:null,nextName:next?next[1]:null}}
function heatmap(){
  const end=new Date();
  const start=new Date();start.setDate(start.getDate()-83);
  start.setDate(start.getDate()-((start.getDay()+6)%7)); /* align to Monday */
  const weeks=Math.ceil((Math.round((end-start)/86400000)+1)/7);
  const tk=today();
  let total=0,active=0,best=0,bestDay="",wkTotal=0;
  let cells="",months="",prevM="";
  const wkStart=new Date(end);wkStart.setDate(wkStart.getDate()-((wkStart.getDay()+6)%7));
  for(let w=0;w<weeks;w++){
    const colDate=new Date(start);colDate.setDate(start.getDate()+w*7);
    const m=colDate.toLocaleString(undefined,{month:"short"});
    months+=`<span>${m!==prevM?m:""}</span>`;prevM=m;
    for(let r=0;r<7;r++){
      const t=new Date(start);t.setDate(start.getDate()+w*7+r);
      if(t>end){cells+='<span class="hc hx"></span>';continue;}
      const k=dstr(t),c=(S.d||{})[k]||0,lv=c===0?0:c<3?1:c<8?2:3;
      total+=c; if(c>0)active++;
      if(c>best){best=c;bestDay=t.toLocaleDateString(undefined,{month:"short",day:"numeric"});}
      if(t>=wkStart)wkTotal+=c;
      cells+=`<span class="hc h${lv} ${k===tk?"htoday":""}" title="${k}: ${c} action${c===1?"":"s"}"></span>`;
    }
  }
  return `<div class="hm-stats"><span><b>${total}</b> actions in the last 12 weeks</span><span><b>${active}</b> active day${active===1?"":"s"}</span><span><b>${wkTotal}</b> this week</span>${best?`<span>best day <b>${best}</b> · ${bestDay}</span>`:""}</div>
  <div class="hm-wrap">
    <div class="hm-days"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span></span></div>
    <div class="hm-scroll">
      <div class="hm-months" style="grid-template-columns:repeat(${weeks},11px)">${months}</div>
      <div class="hm" role="img" aria-label="Activity for the last 12 weeks" style="grid-auto-columns:11px">${cells}</div>
    </div>
  </div>
  <div class="hm-legend">Less <span class="hc h0"></span><span class="hc h1"></span><span class="hc h2"></span><span class="hc h3"></span> More</div>`}

  </div>

        ${!lk&&noteOpen[slug]?`<textarea class="g-notes" data-notetxt="${slug}" placeholder="What did you build? What broke? What will you reuse?">${esc(S.n&&S.n[slug]||"")}</textarea>`:""}</div>

      </div>`;

}

async function certPNG(eyebrow,title,sub,name){

/* ---------- interactive dot field ---------- */
(function(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=document.createElement("canvas");cv.id="dotfx";document.body.prepend(cv);
  document.body.classList.add("fx");
  const ctx=cv.getContext("2d");
  let W,H;
  function rs(){const dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0);}
  rs();addEventListener("resize",rs);
  let mx=-9999,my=-9999,ripples=[];
  addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY;});
  addEventListener("pointerleave",()=>{mx=-9999;my=-9999;});
  addEventListener("pointerdown",e=>{ripples.push({x:e.clientX,y:e.clientY,r:0});if(ripples.length>4)ripples.shift();});
  function colors(){const cs=getComputedStyle(document.documentElement);return{dot:cs.getPropertyValue("--dot").trim()||"#E6E6DF",acc:cs.getPropertyValue("--accent").trim()||"#0B5FFF"}}
  let col=colors();
  window.__dotRefresh=()=>{col=colors()};
  const mq=matchMedia("(prefers-color-scheme: dark)");
  if(mq.addEventListener)mq.addEventListener("change",()=>{col=colors()});
  const G=22,R=130;
  function frame(){
    ctx.clearRect(0,0,W,H);
    for(const rp of ripples)rp.r+=7;
    ripples=ripples.filter(rp=>rp.r<Math.max(W,H)*0.7);
    for(let y=G/2;y<H;y+=G)for(let x=G/2;x<W;x+=G){
      const dx=x-mx,dy=y-my,d=Math.hypot(dx,dy);
      let glow=d<R?1-d/R:0;
      for(const rp of ripples){const rd=Math.abs(Math.hypot(x-rp.x,y-rp.y)-rp.r);if(rd<34){const g=(1-rd/34)*(1-rp.r/(Math.max(W,H)*0.7));if(g>glow)glow=g;}}
      if(glow>0.02){
        ctx.globalAlpha=0.25+glow*0.65;ctx.fillStyle=col.acc;
        ctx.beginPath();ctx.arc(x,y,1.1+glow*1.8,0,7);ctx.fill();
      }else{
        ctx.globalAlpha=0.55;ctx.fillStyle=col.dot;
        ctx.beginPath();ctx.arc(x,y,1.1,0,7);ctx.fill();
      }
    }
    ctx.globalAlpha=1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
